<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="tarjeta">
    <h1>Contador</h1>
    <p class="subtitulo">Usa los botones para cambiar el número</p>

    <div class="pantalla" id="numero">0</div>

    <div class="botones">
      <button id="restar" class="secundario">Restar</button>
      <button id="sumar">Sumar</button>
    </div>

    <button id="reiniciar" class="reiniciar">Reiniciar</button>
  </main>
</body>
</html>
